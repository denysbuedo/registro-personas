[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "registro-personas"
version = "0.1.0"
description = "Registro Institucional de Personas — PER-001 privado"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2", "pydantic>=2.10,<3", "psycopg[binary]>=3.2,<4",
  "pyjwt[crypto]>=2.10,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "PyYAML>=6,<7", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
